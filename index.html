<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快問快答 4.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243b53;background:#edf6fc}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 16px 80px}h1{font-size:clamp(30px,7vw,44px)}h2{margin-top:0}.card{background:white;padding:24px;border-radius:24px;margin:18px 0;box-shadow:0 3px 14px #17324b0c}button,input,textarea,select{font:inherit}button{border:0;background:#dcebf9;color:#244866;padding:13px 18px;border-radius:13px;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}button.primary{background:#568fb8;color:white}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{width:100%;padding:12px;border:1px solid #bdd1e1;border-radius:10px;margin:7px 0 13px}textarea{min-height:65px}.hidden{display:none!important}.options{display:grid;gap:10px}.options button{width:100%;text-align:left;margin:0}.options button.selected{background:#79afd4;color:white}.muted{color:#607789}.big{font-size:30px;font-weight:800}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tag{background:#e6f1f9;padding:6px 12px;border-radius:10px}.question-editor{border-top:1px solid #e2edf5;padding:15px 0}.qr{display:flex;justify-content:center;padding:15px}.qr canvas{max-width:100%}.notice{background:#fff5d9;padding:12px;border-radius:10px}.right{color:#197448}.wrong{color:#b63737}#status{min-height:24px}</style></head><body><main><h1>快問快答 4.0</h1><div id="status" class="muted">正在連線…</div>
<section id="home" class="card hidden"><h2>歡迎來玩</h2><button id="hostEntry" class="primary">主持人／題庫管理</button><button id="playerEntry">輸入房號加入</button></section>
<section id="hostLogin" class="card hidden"><h2>主持人登入</h2><p class="muted">主持人使用電子郵件與密碼登入。玩家不會看到這個入口。</p><input id="email" type="email" placeholder="電子郵件"><input id="password" type="password" placeholder="密碼（至少 6 碼）"><div class="row"><button id="login" class="primary">登入</button><button id="register">首次註冊</button><button id="backLogin">返回</button></div><p class="muted">首次註冊後，這個帳號就是你自己的題庫管理帳號。</p></section>
<section id="host" class="hidden"><div class="card"><h2>主持人控制台</h2><div class="row"><button id="editToggle">管理題庫</button><button id="createRoom" class="primary">建立新房間</button><button id="logout">登出</button></div></div><div id="editor" class="card hidden"><h2>我的題庫</h2><label>題庫名稱<input id="quizName"></label><div id="questionList"></div><button id="addQuestion">新增題目</button><button id="saveQuiz" class="primary">儲存題庫</button><button id="resetQuiz">恢復原始題庫</button></div><div id="hostRoom" class="card hidden"><h2>房號 <span id="roomCode"></span></h2><div class="qr" id="qr"></div><p>請朋友掃描 QR Code，或複製下方網址：</p><input id="invite" readonly><button id="copyInvite">複製邀請連結</button><p id="playerList">等待玩家加入…</p><div id="hostGame"></div><button id="start" class="primary">開始遊戲</button><button id="reveal" class="hidden">提前公布答案</button><button id="next" class="hidden primary">下一題</button><button id="end" class="hidden">結束遊戲</button></div></section>
<section id="join" class="card hidden"><h2>加入遊戲</h2><label>房號<input id="joinCode" inputmode="numeric" maxlength="6" placeholder="6 位數房號"></label><label>你的暱稱<input id="nickname" maxlength="20" placeholder="輸入暱稱"></label><button id="joinBtn" class="primary">加入房間</button><button id="backJoin">返回</button></section>
<section id="player" class="card hidden"><h2>房號 <span id="playerCode"></span></h2><p id="playerStatus">等待主持人開始…</p><div id="playerQuestion"></div><div id="playerResult"></div><h3>排行榜</h3><div id="ranking"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script type="module" src="./app-v6.js"></script></body></html>
